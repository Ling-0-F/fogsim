[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogsim-reproduction"
version = "0.4.0"
description = "Fixed, dynamic and replay fog workflow simulator based on Xu et al. (2023)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
train = ["deap==1.4.4"]

[project.scripts]
fogsim = "fogsim.cli:main"
fogsim-train = "fogsim.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
